project:
  env_id: "UR3eReach-v0"
  obs_mode: "state"
  control_mode: "pd_joint_delta_pos"
  seed: 0

robot:
  uid: "ur3e_ezgripper"

  expected_arm_dof: 6

  base_position:
    - 0.0
    - 0.0
    - 0.0

  initial_arm_qpos:
    - 0.0
    - -1.5707963
    - 1.5707963
    - -1.5707963
    - -1.5707963
    - 0.0

  initial_gripper_qpos:
    - 0.27
    - 0.27


gripper:
  # 正規化された1次元グリッパ行動
  open_action: -1.0
  close_action: 1.0

  # URDF内で確認済みの指先パッドリンク
  left_contact_links:
    - "gripper_ezgripper_finger_pad_1"
  right_contact_links:
    - "gripper_ezgripper_finger_pad_2"

  # Day 4の接触検証用の暫定値。実測結果で調整する
  contact_force_threshold_n: 0.1
  grasp_center_distance_threshold_m: 0.04

  pre_contact_action: 0.57
  pre_contact_gap_m: 0.055

table:
  surface_z: 0.0

cube:
  size: 0.05
  mass: 0.10
  position: [0.40, 0.00, 0.025]
  orientation_wxyz: [1.0, 0.0, 0.0, 0.0]

task:
  lift_height: 0.05
  hold_steps: 10
  max_episode_steps: 200

  tcp_grasp_offset: [0.0, 0.0, 0.0]
  pregrasp_clearance: 0.10

  success_distance_tolerance: 0.02

residual:
  alpha: 0.20
  max_joint_delta_rad: 0.03

safety:
  max_base_to_target_distance: 0.48
  min_target_z: 0.01


day5:
  # Gripperをpre-contactからcloseまで
  # 一気に動かさず段階的に閉じる
  grasp_ramp_steps: 100

  # 左右接触がこのstep数連続したら
  # 閉動作を停止する
  bilateral_contact_streak: 3

  # 接触成立後、この分だけ追加で閉じる。
  # 最初は0でよい。
  squeeze_margin_action: 0.0

  # 重力を戻して静止保持する時間
  hold_steps: 100

  # 微小持ち上げ
  micro_lift_height_m: 0.01
  lift_steps: 60

  # 数値Jacobian算出用
  jacobian_epsilon_rad: 0.002

  # IK相当の結果として許容する
  # 1関節あたりの最大総変化量
  max_lift_joint_change_rad: 0.15

  # シミュレーション上の異常な押し込みを
  # 検出するための暫定上限。
  # 実機EZGripperの安全仕様値ではない。
  max_contact_force_n: 30.0

  # Gravityを戻した後にこの値以上落下すれば失敗
  max_hold_drop_m: 0.01

  # 10 mm目標に対して8 mm以上上がれば成功とする
  micro_lift_success_threshold_m: 0.008


day6:
  # Cube中心からPre-graspまでの高さ
  pregrasp_height_m: 0.10

  # grasp centerはCube中心へ合わせる
  grasp_center_offset_m:
    - 0.0
    - 0.0
    - 0.015

  # 5 cm成功に対し5 mmの追従余裕を持たせる
  reference_lift_height_m: 0.055

  success_lift_height_m: 0.05
  success_hold_steps: 10

  # IK
  ik_epsilon_rad: 0.002
  ik_damping: 0.03
  ik_tolerance_m: 0.0015
  ik_max_iterations: 40
  ik_max_step_rad: 0.04

  # Cartesian軌道を何分割するか
  to_pregrasp_waypoints: 20
  descend_waypoints: 20
  lift_waypoints: 15

  # 1 waypointを何step保持するか
  control_steps_per_waypoint: 4

  # 各phase終了後の静止時間
  pregrasp_hold_steps: 10
  grasp_hold_steps: 20
  final_hold_steps: 20

  # Gripper
  grasp_ramp_steps: 100
  bilateral_contact_streak: 3
  squeeze_margin_action: 0.02

  # Day5と同じ暫定異常検出値
  max_contact_force_n: 30.0

  # 接触判定とは別の「安定把持」判定
  stable_grasp_force_n: 5.0

  # Lift前の保持テスト
  pre_lift_hold_steps: 30

  # 30 step中24 step以上、左右接触していること
  pre_lift_required_contact_ratio: 0.8

  # 検出後に少し追加で閉じる
  squeeze_margin_action: 0.05

day9:
  # 内部のManiSkill TimeLimit。
  # Day6軌道＋grasp＋holdを十分収容する値。
  base_env_max_episode_steps: 1000

  # reset後、Reference開始前に
  # EZGripperをpre-contact状態へ安定させる。
  reset_precontact_steps: 60

  # residual=0 と reference action の
  # 数値的一致判定。
  zero_residual_tolerance: 1.0e-7

day10:

  # Approach

  # 1 cm接近したときの正規化基準
  approach_progress_scale_m: 0.01

  # 1 cm接近で最大 +0.2
  approach_progress_weight: 0.2

  # Grasp / Hold
  bilateral_contact_bonus: 0.05

  hold_contact_bonus: 0.02

  # Lift

  # 1 cm上昇すると +1.0
  lift_progress_weight: 100.0

  # 1stepの異常値を抑える
  max_lift_delta_per_step_m: 0.01

  # Terminal

  success_bonus: 10.0

  failure_penalty: 5.0

  # Residual regularization

  residual_penalty_weight: 0.1

  # Contact safety

  max_safe_gripper_force_n: 30.0

  excessive_force_penalty_weight: 0.2

  unsafe_collision_penalty: 5.0

day11:

  # --------------------------------------------------
  # Smoke training
  # --------------------------------------------------

  seed: 0

  # 元実装は500
  start_timesteps: 500

  # 元実装は5000。
  # Day11では動作確認なので短縮する。
  max_timesteps: 1500

  batch_size: 32

  replay_size: 100000

  # --------------------------------------------------
  # TD3
  # --------------------------------------------------

  # 元Yaginuma実装は0.0だが、
  # 今回は1 stepがlow-level controlなので0.99を使用。
  discount: 0.99

  # 元実装と同じ
  tau: 0.05

  # normalized residual action [-1,1]に対する割合
  exploration_noise: 0.10

  policy_noise: 0.05

  noise_clip: 0.10

  policy_freq: 2

  actor_lr: 0.0001

  critic_lr: 0.001

  # AdamWの標準値を明示
  weight_decay: 0.01

  # --------------------------------------------------
  # Network
  # --------------------------------------------------

  actor_hidden_dim: 32

  critic_hidden_dim: 128

  # --------------------------------------------------
  # Output
  # --------------------------------------------------

  checkpoint_interval: 500

  log_interval: 100

day12:
  candidate_radii_mm:
    - 0.0
    - 10.0
    - 12.5
    - 15.0
    - 17.5
    - 20.0

  episodes_per_radius: 10

  direction_mode: random_angle

  target_success_rate_min: 0.20
  target_success_rate_max: 0.60

  baseline_min_success_rate: 0.80

  max_steps_per_episode: 600

  seed: 1200

  # Day12 calibration result:
  # 8 directions x 4 trials = 32 episodes
  # Reference-only success = 17 / 32 = 53.125 %
  selected_radius_mm: 20.0


day13:

  # --------------------------------------------------
  # Task
  # --------------------------------------------------

  # Day12 calibration result
  train_radius_mm: 20.0

  # Day12:
  # Reference-only = 17 / 32
  reference_baseline_success_rate: 0.53125

  # --------------------------------------------------
  # Training
  # --------------------------------------------------

  train_seed: 1300

  # Day11 smokeより十分長く学習する
  max_timesteps: 30000

  # Replay Buffer初期収集
  start_timesteps: 500

  max_steps_per_episode: 600

  # --------------------------------------------------
  # Evaluation
  # --------------------------------------------------

  eval_seed: 1200

  eval_interval: 5000

  eval_num_directions: 32

  # 定期評価
  # 8 directions x 2 = 16 episodes
  eval_episodes_per_direction: 2

  # Day13終了時評価
  # 8 directions x 4 = 32 episodes
  final_eval_episodes_per_direction: 4

  # --------------------------------------------------
  # Logging / checkpoint
  # --------------------------------------------------

  checkpoint_interval: 5000

  log_interval: 500

  lift_threshold_m: 0.05

  residual_saturation_threshold: 0.95


day14:

  # Day12 calibration result
  radius_mm: 20.0

  # Day13 best checkpoint
  checkpoint: runs/day13_td3_seed1300/checkpoints/best.pt

  # 32種類の異なる配置を評価
  num_directions: 32

  # 同じ方向を繰り返すより、
  # 円周上32方向を1回ずつ評価する
  episodes_per_direction: 1

  eval_seed: 1200

  max_steps_per_episode: 600

  # Gate 2
  gate_min_success_rate: 0.50
  gate_min_improvement_percentage_points: 20.0

  # Residual analysis
  residual_saturation_threshold: 0.95


day15:

  # --------------------------------------------------
  # Fixed Day14 evaluation condition
  # --------------------------------------------------

  checkpoint: runs/day13_td3_seed1300/checkpoints/best.pt

  radius_mm: 20.0

  num_directions: 32

  episodes_per_direction: 1

  eval_seed: 1200

  max_steps_per_episode: 600

  # --------------------------------------------------
  # Failure classification thresholds
  # --------------------------------------------------

  # 正式な成功Lift高さ
  lift_threshold_m: 0.05

  # 「少なくともLift動作が始まった」とみなす高さ
  lift_start_threshold_m: 0.005

  # 安定把持とみなす連続両側接触step
  stable_grasp_steps: 10

  # 一度5 cm持ち上げた後、この程度以上落ちた場合
  # drop_after_lift と分類
  drop_margin_m: 0.01

  # 初期Cube位置からXY方向へ3 cm以上移動した場合
  # knocked_away の候補
  knock_xy_threshold_m: 0.03

  residual_saturation_threshold: 0.95


day16:

  # Day13 best checkpointを固定して比較
  checkpoint: runs/day13_td3_seed1300/checkpoints/best.pt

  # Day12で決定した評価摂動
  radius_mm: 20.0

  # Day14/15と同一評価条件
  num_directions: 32
  episodes_per_direction: 1
  eval_seed: 1200

  max_steps_per_episode: 600

  # --------------------------------------------------
  # 今回変更する唯一のパラメータ
  # --------------------------------------------------

  candidate_lift_residual_scales:
    - 1.00
    - 0.75
    - 0.50

  # Day16終了後に決定する。
  # この時点ではnullのまま。
  selected_lift_residual_scale: null

  # --------------------------------------------------
  # Day15で最多だったLift系失敗
  # --------------------------------------------------

  target_failure_causes:
    - insufficient_lift
    - no_lift_after_grasp

  residual_saturation_threshold: 0.95


day17:

  # Day17で変更する唯一の表現パラメータ
  cube_to_grasp_scale: 10.0

  train_radius_mm: 20.0

  # Day13と同じseedにする
  train_seed: 1300
  eval_seed: 1200

  # 50kまで学習するが、
  # 30k checkpointをDay13との同step比較に使う
  max_timesteps: 50000
  hypothesis_comparison_step: 30000

  start_timesteps: 500
  max_steps_per_episode: 600

  eval_interval: 5000

  periodic_eval_num_directions: 16
  periodic_eval_episodes_per_direction: 1

  checkpoint_interval: 5000
  log_interval: 500

  candidate_count: 3

  final_eval_num_directions: 32
  final_eval_episodes_per_direction: 1

  lift_threshold_m: 0.05
  residual_saturation_threshold: 0.95

  gate_min_success_rate: 0.60


day18:

  # Day18では学習せず候補checkpointを再評価する
  radius_mm: 20.0

  # Day17のcheckpoint選択では1200を使用済み。
  # 最終選択ではheld-out seedを使う。
  eval_seed: 1800

  # 64方向 × 1 episode
  # 5.625度刻みで20 mm円周を評価
  num_directions: 64
  episodes_per_direction: 1

  max_steps_per_episode: 600

  lift_threshold_m: 0.05
  residual_saturation_threshold: 0.95

  # Gate3
  gate_min_success_rate: 0.60

  selected_checkpoint: null
  selected_cube_to_grasp_scale: null


day19:
  eval_seed: 1900

  final_checkpoint: runs/day18_final/checkpoints/final_selected.pt
  final_metadata: runs/day18_final/final_policy_metadata.json

  cube_to_grasp_scale: 10.0

  nominal_radius_mm: 0.0
  nominal_episodes: 64

  perturb_radius_mm: 20.0
  perturb_num_directions: 64
  perturb_episodes_per_direction: 1

  max_steps_per_episode: 600

  target_success_rate: 0.60

  collision_instrumentation_validated: false